<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#FF7A30" />
		<meta name="author" content="Aaryan Dehade" />

		<link rel="icon" href="%sveltekit.assets%/favicon.ico?v=2" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=2" />
		<meta name="robots" content="index, follow" />

		<!-- Open Graph / Social Media Preview -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://shalendar.aaryandehade.com/" />
		<meta property="og:title" content="Shalendar — Shared Multi-Person Calendar" />
		<meta property="og:description" content="Sync and view your shared calendar seamlessly with iOS Shortcuts integration, timezone conversions, and color-coded overlays." />
		<meta property="og:image" content="%sveltekit.assets%/og-preview.png" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://shalendar.aaryandehade.com/" />
		<meta name="twitter:title" content="Shalendar — Shared Multi-Person Calendar" />
		<meta name="twitter:description" content="Sync and view your shared calendar seamlessly with iOS Shortcuts integration, timezone conversions, and color-coded overlays." />
		<meta name="twitter:image" content="%sveltekit.assets%/og-preview.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
